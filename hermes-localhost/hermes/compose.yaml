services:

  hermes:
    image: hermes-agent:local
    build: .
    container_name: hermes

    restart: unless-stopped

    command: gateway run

    environment:
      TZ: Europe/Madrid

      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"

      API_SERVER_KEY: "rnyR85qzFzS1SztH7vlfg9TZVDsC9v2J"

      HERMES_DESKTOP: "true"
      SEARXNG_URL: "http://searxng:8080"
      # Timeout de inactividad del agente (override del default 1800s):
      # 6300s = 105 min. Precedencia sobre agent.gateway_timeout de config.yaml.
      HERMES_AGENT_TIMEOUT: "10800"

    volumes:
      - ./data:/opt/data
      - ./workspace:/workspace

    networks:
      - hermes-net
      - searxng-net
      - z-browser-net

    mem_limit: 4g
    cpus: "2"

  browser:
    image: browserless/chrome:latest
    container_name: hermes-browser
    restart: unless-stopped
    environment:
      CONNECTION_TIMEOUT: "120000"
      MAX_CONCURRENT_SESSIONS: "5"
      PREBOOT_CHROME: "true"
    networks:
      - z-browser-net

  searxng:
    image: searxng/searxng:latest
    container_name: hermes-searxng
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: "d3ae9e03aedf94d5b7961822041de58e198780dc0bae3fd4161924829ef98b60"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - searxng-net

networks:

  hermes-net:
    external: true
    name: hermes-net

  searxng-net:
    driver: bridge

  z-browser-net:
    driver: bridge
