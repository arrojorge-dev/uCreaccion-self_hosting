services:
  backend:
    build: .
    container_name: hermes-api
    restart: unless-stopped
    user: "10000:10000"
    env_file: .env
    environment:
      NODE_ENV: production
      PRETTY_LOGS: "false"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hermes_api
      REDIS_URL: redis://redis:6379
      HERMES_TIMEOUT_MS: "10800000"
      LOCAL_USER_NICKNAME: john
      LOCAL_USER_PASSWORD: "44349989"
      CORS_ORIGINS: "https://tauri.localhost"
      QUOTA_FREE_REQUESTS: "1000000000"
      QUOTA_FREE_TOKENS: "1000000000000"
      QUOTA_PRO_REQUESTS: "1000000000000"
      QUOTA_PRO_TOKENS: "1000000000000"
      MAX_INPUT_TOKENS: "0"
      # Conexión hermes↔ollama por task. OLLAMA_BASE_URL obligatoria (el backend no
      # arranca sin ella). OLLAMA_API_KEY opcional (vacía permitida).
      OLLAMA_BASE_URL: "http://192.168.1.39:11434/v1"
      OLLAMA_API_KEY: ""
      # APNs (push iOS): los valores (APNS_ENV/KEY_P8/KEY_ID/TEAM_ID/TOPIC)
      # se cargan desde `.env` vía `env_file` (env.ts normaliza los `\n` del PEM).
      # Sin APNS_KEY_P8/KEY_ID/TEAM_ID el push queda desactivado (Noop).
    ports:
      - "127.0.0.1:5001:5000"
      - "${API_BIND_ADDRESS}:5001:5000"
    volumes:
      - /home/arrojorge/backend-api-hermes/bck-server-hermes-sept26/hermes-scaleway/hermes/data/outputs:/hermes-outputs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/health/live"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - backend-net
      - hermes-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Aplica las migraciones antes de que el backend arranque (imagen build con prisma CLI).
  migrate:
    build:
      context: .
      target: build
    container_name: hermes-api-migrate
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hermes_api
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "npx prisma migrate deploy"]
    networks:
      - backend-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    container_name: hermes-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hermes_api
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hermes_api"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: hermes-api-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Copia de seguridad on-demand: docker compose run --rm backup
  # Programación (cron del host): 0 2 * * * cd /opt/hermes-api && docker compose run --rm backup
  backup:
    image: postgres:16-alpine
    container_name: hermes-api-backup
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: hermes_api
      BACKUP_DIR: /backups
      KEEP: "14"
    volumes:
      - backups:/backups
      - ./scripts:/scripts:ro
    command: ["sh", "/scripts/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  backups:

networks:
  backend-net:
    driver: bridge
  hermes-net:
    external: true
    name: hermes_hermes-net
